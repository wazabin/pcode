name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; packages = json.load(sys.stdin)["packages"]; print(next(package["version"] for package in packages if package["name"] == "wazabin-pcode"))')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish wazabin-pcode
        run: |
          if cargo publish; then
            exit 0
          fi

          # Permit a manual re-run after this version has already uploaded.
          cargo info "wazabin-pcode@$RELEASE_VERSION" >/dev/null 2>&1
